[project]
name = "fmhy-bookmarks"
version = "2.0.0"
description = "Convert FMHY resources into browser-importable bookmarks HTML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
convert-fmhy-bookmarks = "convert_fmhy_bookmarks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["convert_fmhy_bookmarks.py"]
